<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无缝滚动跑马灯</title>
    <style>
        /* 1. 滚动容器样式 */
        .marquee-container {
            width: 100%;
            max-width: 600px; /* 限制最大宽度，方便观察效果 */
            overflow: hidden; /* 核心：隐藏超出容器的内容 */
            position: relative;
            white-space: nowrap; /* 核心：强制文本不换行 */
            background-color: #f0f0f0;
            padding: 10px 0;
            border-radius: 8px;
        }

        /* 2. 滚动内容样式 */
        .marquee-content {
            display: inline-block; /* 核心：让内容可以被 transform 平移 */
            animation: scroll-left 15s linear infinite; /* 匀速、无限循环动画 */
            will-change: transform; /* 性能优化：触发 GPU 硬件加速 */
        }

        /* 3. 利用伪元素无缝复制一份文本 */
        .marquee-content::after {
            content: attr(data-text); /* 读取 data-text 属性的值作为内容 */
            padding-left: 4rem; /* 两段文本之间留出间距 */
        }

        /* 4. 定义关键帧动画 */
        @keyframes scroll-left {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%); /* 移动总宽度的一半（原文本+伪元素），实现无缝 */
            }
        }

        /* 5. 交互：鼠标悬停时暂停滚动 */
        .marquee-container:hover .marquee-content {
            animation-play-state: paused;
        }
    </style>
</head>
<body style="padding: 50px; font-family: sans-serif;">

    <!-- 滚动容器 -->
    <div class="marquee-container">
        <!-- data-text 属性中的文本需要与标签内的文本保持一致 -->
        <span class="marquee-content" data-text="🎉 欢迎来到无缝滚动演示！这是一段用于测试跑马灯效果的文本内容，当文本长度超过容器宽度时会自动循环滚动展示。">
            🎉 欢迎来到无缝滚动演示！这是一段用于测试跑马灯效果的文本内容，当文本长度超过容器宽度时会自动循环滚动展示。
        </span>
    </div>

</body>
</html>
